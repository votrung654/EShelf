apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eshelf-prod

resources:
  - ../../base

replicas:
  - name: frontend
    count: 2
  - name: api-gateway
    count: 3
  - name: auth-service
    count: 3
  - name: book-service
    count: 3
  - name: user-service
    count: 3
  - name: ml-service
    count: 2

images:
  - name: eshelf/frontend
    newName: docker.io/22521571/eshelf-frontend
    newTag: prod
  - name: eshelf/api-gateway
    newName: docker.io/22521571/eshelf-api-gateway
    newTag: prod
  - name: eshelf/auth-service
    newName: docker.io/22521571/eshelf-auth-service
    newTag: prod
  - name: eshelf/book-service
    newName: docker.io/22521571/eshelf-book-service
    newTag: prod
  - name: eshelf/user-service
    newName: docker.io/22521571/eshelf-user-service
    newTag: prod
  - name: eshelf/ml-service
    newName: docker.io/22521571/eshelf-ml-service
    newTag: prod

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: eshelf-ingress
  - path: api-gateway-patch.yaml
    target:
      kind: Deployment
      name: api-gateway
  - path: auth-service-patch.yaml
    target:
      kind: Deployment
      name: auth-service
  - path: book-service-patch.yaml
    target:
      kind: Deployment
      name: book-service
  - path: user-service-patch.yaml
    target:
      kind: Deployment
      name: user-service
  - path: ml-service-patch.yaml
    target:
      kind: Deployment
      name: ml-service

configMapGenerator:
  - name: app-config
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn

commonLabels:
  environment: production
  app.kubernetes.io/name: eshelf

