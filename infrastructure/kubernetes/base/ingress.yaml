apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eshelf-ingress
  namespace: eshelf
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - eshelf.example.com
    secretName: eshelf-tls
  rules:
  - host: eshelf.example.com
    http:
      paths:
      # Frontend - serve static files
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      # API Gateway - proxy API requests
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 3000






