name: Smart Build Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  # Detect changes
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.code-check.outputs.frontend }}
      api-gateway: ${{ steps.code-check.outputs.api-gateway }}
      auth-service: ${{ steps.code-check.outputs.auth-service }}
      book-service: ${{ steps.code-check.outputs.book-service }}
      user-service: ${{ steps.code-check.outputs.user-service }}
      ml-service: ${{ steps.code-check.outputs.ml-service }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Cần 2 commits để so sánh
      
      # Bước 1: Filter paths (nhanh hơn)
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'vite.config.js'
            api-gateway:
              - 'backend/services/api-gateway/**'
            auth-service:
              - 'backend/services/auth-service/**'
            book-service:
              - 'backend/services/book-service/**'
            user-service:
              - 'backend/services/user-service/**'
            ml-service:
              - 'backend/services/ml-service/**'
      
      # Bước 2: Check xem có code changes thực sự không (bỏ qua comment)
      - name: Check for real code changes
        id: code-check
        run: |
          chmod +x scripts/check-service-changes.sh
          
          # Base ref để so sánh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="HEAD~1"
          fi
          
          # Check frontend
          if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
            if ./scripts/check-service-changes.sh src public index.html package.json vite.config.js "$BASE_REF"; then
              echo "frontend=true" >> $GITHUB_OUTPUT
              echo "✓ frontend: Real code changes detected"
            else
              echo "frontend=false" >> $GITHUB_OUTPUT
              echo "✗ frontend: Only comment/whitespace changes, skipping build"
            fi
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
            echo "○ frontend: No file changes"
          fi
          
          # Check api-gateway
          if [ "${{ steps.filter.outputs.api-gateway }}" = "true" ]; then
            if ./scripts/check-service-changes.sh backend/services/api-gateway "$BASE_REF"; then
              echo "api-gateway=true" >> $GITHUB_OUTPUT
              echo "✓ api-gateway: Real code changes detected"
            else
              echo "api-gateway=false" >> $GITHUB_OUTPUT
              echo "✗ api-gateway: Only comment/whitespace changes, skipping build"
            fi
          else
            echo "api-gateway=false" >> $GITHUB_OUTPUT
            echo "○ api-gateway: No file changes"
          fi
          
          # Check auth-service
          if [ "${{ steps.filter.outputs.auth-service }}" = "true" ]; then
            if ./scripts/check-service-changes.sh backend/services/auth-service "$BASE_REF"; then
              echo "auth-service=true" >> $GITHUB_OUTPUT
              echo "✓ auth-service: Real code changes detected"
            else
              echo "auth-service=false" >> $GITHUB_OUTPUT
              echo "✗ auth-service: Only comment/whitespace changes, skipping build"
            fi
          else
            echo "auth-service=false" >> $GITHUB_OUTPUT
            echo "○ auth-service: No file changes"
          fi
          
          # Check book-service
          if [ "${{ steps.filter.outputs.book-service }}" = "true" ]; then
            if ./scripts/check-service-changes.sh backend/services/book-service "$BASE_REF"; then
              echo "book-service=true" >> $GITHUB_OUTPUT
              echo "✓ book-service: Real code changes detected"
            else
              echo "book-service=false" >> $GITHUB_OUTPUT
              echo "✗ book-service: Only comment/whitespace changes, skipping build"
            fi
          else
            echo "book-service=false" >> $GITHUB_OUTPUT
            echo "○ book-service: No file changes"
          fi
          
          # Check user-service
          if [ "${{ steps.filter.outputs.user-service }}" = "true" ]; then
            if ./scripts/check-service-changes.sh backend/services/user-service "$BASE_REF"; then
              echo "user-service=true" >> $GITHUB_OUTPUT
              echo "✓ user-service: Real code changes detected"
            else
              echo "user-service=false" >> $GITHUB_OUTPUT
              echo "✗ user-service: Only comment/whitespace changes, skipping build"
            fi
          else
            echo "user-service=false" >> $GITHUB_OUTPUT
            echo "○ user-service: No file changes"
          fi
          
          # Check ml-service
          if [ "${{ steps.filter.outputs.ml-service }}" = "true" ]; then
            if ./scripts/check-service-changes.sh backend/services/ml-service "$BASE_REF"; then
              echo "ml-service=true" >> $GITHUB_OUTPUT
              echo "✓ ml-service: Real code changes detected"
            else
              echo "ml-service=false" >> $GITHUB_OUTPUT
              echo "✗ ml-service: Only comment/whitespace changes, skipping build"
            fi
          else
            echo "ml-service=false" >> $GITHUB_OUTPUT
            echo "○ ml-service: No file changes"
          fi

  # Build Frontend (only if changed)
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Determine environment tag
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push frontend Docker image
        run: |
          # Helper function for retry logic
          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempting to push $image (attempt $attempt/$max_attempts)..."
              if timeout 120 docker push "$image" --quiet; then
                echo "Successfully pushed $image"
                return 0
              else
                echo "Failed to push $image, attempt $attempt/$max_attempts"
                if [ $attempt -lt $max_attempts ]; then
                  sleep 5
                fi
                attempt=$((attempt + 1))
              fi
            done
            
            echo "Warning: Failed to push $image after $max_attempts attempts (non-critical)"
            return 1
          }
          
          ENV_TAG="${{ steps.env.outputs.env }}"
          IMAGE_NAME="docker.io/22521571/eshelf-frontend"
          
          # Determine API URL based on environment
          if [ "$ENV_TAG" = "prod" ]; then
            VITE_API_URL="https://api.eshelf.example.com/api"
          elif [ "$ENV_TAG" = "staging" ]; then
            VITE_API_URL="https://staging-api.eshelf.example.com/api"
          else
            VITE_API_URL="http://api-gateway:3000/api"
          fi
          
          # Build with environment-specific API URL
          docker build --build-arg VITE_API_URL=$VITE_API_URL -t $IMAGE_NAME:$ENV_TAG -t $IMAGE_NAME:${{ github.sha }} .
          
          # Push images with retry
          push_with_retry $IMAGE_NAME:$ENV_TAG || true
          push_with_retry $IMAGE_NAME:${{ github.sha }} || true
          push_with_retry $IMAGE_NAME:latest || true
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  # Build API Gateway (only if changed)
  build-api-gateway:
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Determine environment tag
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          # Helper function for retry logic
          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempting to push $image (attempt $attempt/$max_attempts)..."
              if timeout 120 docker push "$image" --quiet; then
                echo "Successfully pushed $image"
                return 0
              else
                echo "Failed to push $image, attempt $attempt/$max_attempts"
                if [ $attempt -lt $max_attempts ]; then
                  sleep 5
                fi
                attempt=$((attempt + 1))
              fi
            done
            
            echo "Warning: Failed to push $image after $max_attempts attempts (non-critical)"
            return 1
          }
          
          ENV_TAG="${{ steps.env.outputs.env }}"
          IMAGE_NAME="docker.io/22521571/eshelf-api-gateway"
          SHA_TAG="${{ github.sha }}"
          
          docker build -t $IMAGE_NAME:$ENV_TAG -t $IMAGE_NAME:$SHA_TAG backend/services/api-gateway/
          
          # Push images with retry
          push_with_retry $IMAGE_NAME:$ENV_TAG || true
          push_with_retry $IMAGE_NAME:$SHA_TAG || true
          push_with_retry $IMAGE_NAME:latest || true

  # Build Auth Service (only if changed)
  build-auth-service:
    needs: changes
    if: needs.changes.outputs.auth-service == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Determine environment tag
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          # Helper function for retry logic
          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempting to push $image (attempt $attempt/$max_attempts)..."
              if timeout 120 docker push "$image" --quiet; then
                echo "Successfully pushed $image"
                return 0
              else
                echo "Failed to push $image, attempt $attempt/$max_attempts"
                if [ $attempt -lt $max_attempts ]; then
                  sleep 5
                fi
                attempt=$((attempt + 1))
              fi
            done
            
            echo "Warning: Failed to push $image after $max_attempts attempts (non-critical)"
            return 1
          }
          
          ENV_TAG="${{ steps.env.outputs.env }}"
          IMAGE_NAME="docker.io/22521571/eshelf-auth-service"
          SHA_TAG="${{ github.sha }}"
          
          docker build -t $IMAGE_NAME:$ENV_TAG -t $IMAGE_NAME:$SHA_TAG backend/services/auth-service/
          
          # Push images with retry
          push_with_retry $IMAGE_NAME:$ENV_TAG || true
          push_with_retry $IMAGE_NAME:$SHA_TAG || true
          push_with_retry $IMAGE_NAME:latest || true

  # Build Book Service (only if changed)
  build-book-service:
    needs: changes
    if: needs.changes.outputs.book-service == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Determine environment tag
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          # Helper function for retry logic
          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempting to push $image (attempt $attempt/$max_attempts)..."
              if timeout 120 docker push "$image" --quiet; then
                echo "Successfully pushed $image"
                return 0
              else
                echo "Failed to push $image, attempt $attempt/$max_attempts"
                if [ $attempt -lt $max_attempts ]; then
                  sleep 5
                fi
                attempt=$((attempt + 1))
              fi
            done
            
            echo "Warning: Failed to push $image after $max_attempts attempts (non-critical)"
            return 1
          }
          
          ENV_TAG="${{ steps.env.outputs.env }}"
          IMAGE_NAME="docker.io/22521571/eshelf-book-service"
          SHA_TAG="${{ github.sha }}"
          
          docker build -t $IMAGE_NAME:$ENV_TAG -t $IMAGE_NAME:$SHA_TAG backend/services/book-service/
          
          # Push images with retry
          push_with_retry $IMAGE_NAME:$ENV_TAG || true
          push_with_retry $IMAGE_NAME:$SHA_TAG || true
          push_with_retry $IMAGE_NAME:latest || true

  # Build User Service (only if changed)
  build-user-service:
    needs: changes
    if: needs.changes.outputs.user-service == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Determine environment tag
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          # Helper function for retry logic
          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempting to push $image (attempt $attempt/$max_attempts)..."
              if timeout 120 docker push "$image" --quiet; then
                echo "Successfully pushed $image"
                return 0
              else
                echo "Failed to push $image, attempt $attempt/$max_attempts"
                if [ $attempt -lt $max_attempts ]; then
                  sleep 5
                fi
                attempt=$((attempt + 1))
              fi
            done
            
            echo "Warning: Failed to push $image after $max_attempts attempts (non-critical)"
            return 1
          }
          
          ENV_TAG="${{ steps.env.outputs.env }}"
          IMAGE_NAME="docker.io/22521571/eshelf-user-service"
          SHA_TAG="${{ github.sha }}"
          
          docker build -f backend/services/user-service/Dockerfile -t $IMAGE_NAME:$ENV_TAG -t $IMAGE_NAME:$SHA_TAG backend/
          
          # Push images with retry
          push_with_retry $IMAGE_NAME:$ENV_TAG || true
          push_with_retry $IMAGE_NAME:$SHA_TAG || true
          push_with_retry $IMAGE_NAME:latest || true
        continue-on-error: false

  # Build ML Service (only if changed)
  build-ml-service:
    needs: changes
    if: needs.changes.outputs.ml-service == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Determine environment tag
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          # Helper function for retry logic
          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempting to push $image (attempt $attempt/$max_attempts)..."
              if timeout 120 docker push "$image" --quiet; then
                echo "Successfully pushed $image"
                return 0
              else
                echo "Failed to push $image, attempt $attempt/$max_attempts"
                if [ $attempt -lt $max_attempts ]; then
                  sleep 5
                fi
                attempt=$((attempt + 1))
              fi
            done
            
            echo "Warning: Failed to push $image after $max_attempts attempts (non-critical)"
            return 1
          }
          
          ENV_TAG="${{ steps.env.outputs.env }}"
          IMAGE_NAME="docker.io/22521571/eshelf-ml-service"
          SHA_TAG="${{ github.sha }}"
          
          docker build -t $IMAGE_NAME:$ENV_TAG -t $IMAGE_NAME:$SHA_TAG backend/services/ml-service/
          
          # Push images with retry
          push_with_retry $IMAGE_NAME:$ENV_TAG || true
          push_with_retry $IMAGE_NAME:$SHA_TAG || true
          push_with_retry $IMAGE_NAME:latest || true

  # Summary
  summary:
    needs: [changes, build-frontend, build-api-gateway, build-auth-service, build-book-service, build-user-service, build-ml-service]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Components:" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "- API Gateway: ${{ needs.changes.outputs.api-gateway }}" >> $GITHUB_STEP_SUMMARY
          echo "- Auth Service: ${{ needs.changes.outputs.auth-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- Book Service: ${{ needs.changes.outputs.book-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- User Service: ${{ needs.changes.outputs.user-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- ML Service: ${{ needs.changes.outputs.ml-service }}" >> $GITHUB_STEP_SUMMARY

