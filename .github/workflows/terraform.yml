name: Terraform Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:

env:
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: 'infrastructure/terraform/environments/dev'

jobs:
  security-scan:
    name: Security Scan (Checkov)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: sarif
          soft_fail: true
          quiet: true
          args: >-
            --skip-check CKV_AWS_130
            --skip-check CKV2_AWS_19
            --skip-check CKV2_AWS_5
            --skip-path modules/security-groups
            --skip-path modules/vpc

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Configure AWS Credentials - Required for backend initialization and data source queries
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -reconfigure -upgrade

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          terraform validate -no-color || {
            echo "Terraform validation failed. Checking for syntax errors..."
            terraform validate -json > validate-output.json 2>&1 || true
            cat validate-output.json || true
            exit 1
          }

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="public_key=dummy" \
            -var="create_k3s_cluster=false" \
            -var="ami_id=" \
            -input=false \
            -no-color \
            -lock=false \
            -out=tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
        continue-on-error: false
        # Note: If credentials fail, check GitHub repository Settings > Secrets and variables > Actions
        # Required secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -reconfigure

      - name: Terraform Plan (before apply)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan -lock-timeout=5m -lock=false
        continue-on-error: false

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -lock-timeout=5m tfplan


